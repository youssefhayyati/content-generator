# Production stack for FlowAI on this server, reachable at http://<server-ip>:8090.
# Only nginx is published; PHP-FPM and Postgres stay on the private network.
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: flowai

services:
  # Serves the built React app and hands /api, /sanctum, /oauth and /up to PHP-FPM.
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${HTTP_PORT:-8090}:80"
    depends_on:
      - app
    restart: unless-stopped

  # Laravel under PHP-FPM. Migrates and caches config on every start (deploy/app-start.sh).
  app:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: flowai
      DB_USERNAME: flowai
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Queued work (AI agents, media generation, publishing runs) and the per-minute scheduler.
  # Same image as app; they run as www-data so files they write stay readable by PHP-FPM.
  worker:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
    env_file: .env
    environment: &laravel-db
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: flowai
      DB_USERNAME: flowai
    user: www-data
    volumes:
      - storage:/app/storage
    command: php artisan queue:work --queue=publishing,agents,media,default --sleep=1 --tries=1 --timeout=900
    depends_on:
      - app
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
    env_file: .env
    environment: *laravel-db
    user: www-data
    volumes:
      - storage:/app/storage
    command: php artisan schedule:work
    depends_on:
      - app
    restart: unless-stopped

  # FlowAI Sound: voices, listening and the composer. Private, like PHP-FPM: only the app talks
  # to it. Models load on first use and unload when idle; the cap keeps a busy moment polite.
  sound:
    build:
      context: ../sound
    mem_limit: 1000m
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowai
      POSTGRES_USER: flowai
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowai -d flowai"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  storage:
