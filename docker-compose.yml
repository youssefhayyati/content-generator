# Everything at once: docker compose up -d
#   dashboard http://localhost:5173 · API :8002 · assistant :8003 · Mailpit :8025
# The GPU models (pictures and videos, voices, songs, lip sync) run on a RunPod pod: runpod/ (one folder,
# one deploy). The assistant runs on the CPU.
# Settings for everything are in one file, .env next to this one (cp .env.example .env). The API, worker
# and scheduler read it as backend/.env; the assistant gets it as its environment.

# The Laravel services share the code, its packages and the settings file.
x-laravel-volumes: &laravel-volumes
  - ./backend:/app
  # vendor/ lives in a Docker volume: reading thousands of files across the
  # Windows bind mount on every request made each one take over a second.
  - vendor:/app/vendor
  # The stack's .env, as Laravel's own. Missing, compose stops and says so: cp .env.example .env
  - type: bind
    source: ./.env
    target: /app/.env
    bind:
      create_host_path: false

services:
  # The dashboard (React + Vite) on http://localhost:5173, the address the API trusts for its
  # session cookie. It proxies /api, /sanctum and /oauth to the API and /assistant/ to the
  # assistant, so the browser only ever talks to one origin. Edits in frontend/ show up live.
  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Linux packages in a volume, apart from any node_modules installed on the host
      - frontend-modules:/app/node_modules
    environment:
      API_ORIGIN: http://api:8000
      ASSISTANT_ORIGIN: http://assistant:8000
    # Installs packages on the first start and whenever package-lock.json changes
    command: sh -c '[ node_modules/.package-lock.json -nt package-lock.json ] || npm ci --no-audit --no-fund; exec npx vite --host 0.0.0.0 --port 5173 --strictPort'
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api
    restart: unless-stopped

  # Laravel API on http://localhost:8002. The dashboard proxies /api, /sanctum and /oauth here.
  api:
    build: ./docker/php
    volumes: *laravel-volumes
    ports:
      # 8000/8001 are taken by other apps on this box; override per stack, e.g. API_PORT=8010.
      - "${API_PORT:-8002}:8000"
    environment:
      # Serve a few requests at once; the SPA fires several in parallel.
      PHP_CLI_SERVER_WORKERS: 4
    # First start installs dependencies, makes the app key (written into .env) and the SQLite
    # file, and migrates (docker/php/start.sh). Restart the container after editing .env.
    command: start-api
    depends_on:
      - mailpit

  # Runs queued work: AI agents, media generation, and publishing runs on the phones.
  # Waits for the api service to finish installing dependencies on the first start.
  worker:
    build: ./docker/php
    volumes: *laravel-volumes
    command: sh -c 'until [ -f vendor/autoload.php ] && grep -q "^APP_KEY=base64:" .env; do sleep 2; done; exec php artisan queue:work --queue=publishing,agents,media,default --sleep=1 --tries=1 --timeout=900'
    depends_on:
      - api

  # Fires due posts every minute and polls media generations (routes/console.php).
  scheduler:
    build: ./docker/php
    volumes: *laravel-volumes
    command: sh -c 'until [ -f vendor/autoload.php ] && grep -q "^APP_KEY=base64:" .env; do sleep 2; done; exec php artisan schedule:work'
    depends_on:
      - api

  # FlowAI Sound: voices (Kokoro), listening (Whisper) and the composer, on CPU. Models load on
  # first use, take turns (one in memory at a time) and unload when idle: about 140 MB at rest,
  # under 1 GB at its busiest.
  sound:
    build: ./sound
    # Off by default: voices, songs and speech recognition come from the RunPod pod now (VoiceStudio with
    # Whisper large-v3, ACE-Step). To run it here anyway: docker compose --profile local-sound up -d sound,
    # and set SOUND_URL=http://sound:8000 in .env.
    profiles: [local-sound]
    mem_limit: 1000m
    restart: unless-stopped

  # The voice assistant (assistant/) on :8003: the Assistant page talks to it at /assistant/
  # through the dashboard's proxy. It runs on the CPU: speech recognition takes about 2 s after you stop
  # talking, and its voice comes from VoiceStudio on the pod (VOICESTUDIO_URL in .env).
  # The first start builds the image and downloads its speech models into assistant-models.
  # Its settings (the Ollama Cloud key, the pod's URLs and keys) are in .env.
  assistant:
    build:
      context: ./assistant
      args:
        TORCH: cpu
    env_file: .env
    environment:
      FLOWAI_URL: http://api:8000
      FLOWAI_DASHBOARD_URL: http://localhost:5173
      BROWSER_ENABLED: "false"
      ASR_DEVICE: cpu
      ASR_DTYPE: float32
      TTS_DEVICE: cpu
      TTS_DTYPE: float32
    ports:
      - "${ASSISTANT_PORT:-8003}:8000"
    volumes:
      - assistant-models:/cache
      - assistant-media:/app/media
      - assistant-voices:/app/voices
      - assistant-data:/app/data
    depends_on:
      - api
    restart: unless-stopped

  # Live phone screens for the Phones page (phone-bridge/server.js): scrcpy's H.264 video from a
  # phone plugged into this machine, and touches back, through the host's adb server. The Vite
  # proxy serves it at /phone-bridge/. It checks the API's signed tickets with APP_KEY, read
  # from backend/.env. On :8006 (8004 is music's, 8005 lipsync's).
  phone-bridge:
    image: node:22-alpine
    working_dir: /app
    command: node server.js
    volumes:
      - ./phone-bridge:/app:ro
      - ./backend:/laravel:ro
    environment:
      ADB_SERVER_HOST: host.docker.internal
    ports:
      - "127.0.0.1:${PHONE_BRIDGE_PORT:-8006}:8004"
    restart: unless-stopped

  # Songs for the assistant's videos: ACE-Step 1.5 (MIT), written from a description of the music
  # ("upbeat acoustic pop, ukulele, hand claps, 112 bpm"). It runs on the RunPod pod (runpod/music, port
  # 8003; MUSIC_URL and MUSIC_API_KEY in .env). This is the same service on this machine's GPU:
  #   docker compose --profile music up -d music, and MUSIC_URL=http://music:8000 in .env
  # Its models wait on the CPU between songs. The first start downloads them (a few GB) into music-models;
  # the API is on :8004 (POST /release_task, GET /health).
  music:
    build: ./runpod/music
    profiles: [music]
    ports:
      - "${MUSIC_PORT:-8004}:8000"
    volumes:
      - music-models:/app/checkpoints
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Lip sync for the assistant's dubs: LatentSync (Apache-2.0) redraws a video's mouth to say new
  # speech. It runs on the RunPod pod (runpod/lipsync, port 8004; LIPSYNC_URL and LIPSYNC_API_KEY in
  # .env). This is the same service on this machine's GPU, for one with 8 GB free or more:
  #   docker compose --profile lipsync up -d lipsync, and LIPSYNC_URL=http://lipsync:8000 in .env
  # Its model waits on the CPU between videos. 1.5 needs about 8 GB of GPU memory; LATENTSYNC_VERSION=1.6
  # is sharper but needs 18 GB. The first start downloads it (about 5.5 GB) into lipsync-models.
  lipsync:
    build: ./runpod/lipsync
    profiles: [lipsync]
    environment:
      LATENTSYNC_VERSION: ${LATENTSYNC_VERSION:-1.5}
    ports:
      - "${LIPSYNC_PORT:-8005}:8000"
    volumes:
      - lipsync-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Catches every email the API sends. Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # Local text models, free and private, at http://ollama:11434 from the API.
  # Pull a model once: docker compose exec ollama ollama pull llama3.1:8b
  # Off by default: FlowAI writes with Ollama Cloud (OLLAMA_CLOUD_API_KEY in .env). To run models on
  # this machine anyway: docker compose --profile local-ollama up -d ollama, and set OLLAMA_URL.
  ollama:
    profiles: [local-ollama]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama

volumes:
  frontend-modules:
  vendor:
  ollama:
  assistant-models:
  assistant-media:
  assistant-voices:
  assistant-data:
  music-models:
  lipsync-models:
