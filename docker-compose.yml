services:
  # Laravel API on http://localhost:8000. The Vite dev server proxies /api, /sanctum
  # and /oauth here, so the browser only ever talks to one origin.
  api:
    build: ./docker/php
    volumes:
      - ./backend:/app
      # vendor/ lives in a Docker volume: reading thousands of files across the
      # Windows bind mount on every request made each one take over a second.
      - vendor:/app/vendor
    ports:
      # 8000/8001 are taken by other apps on this box; override per stack, e.g. API_PORT=8010.
      - "${API_PORT:-8002}:8000"
    environment:
      # Serve a few requests at once; the SPA fires several in parallel.
      PHP_CLI_SERVER_WORKERS: 4
    # First start installs dependencies, creates .env, the app key and the SQLite file,
    # and migrates (docker/php/start.sh). Restart the container after editing .env.
    command: start-api
    depends_on:
      - mailpit

  # Runs queued work: AI agents, media generation, and publishing runs on the phones.
  # Waits for the api service to finish installing dependencies on the first start.
  worker:
    build: ./docker/php
    volumes:
      - ./backend:/app
      - vendor:/app/vendor
    command: sh -c 'until [ -f vendor/autoload.php ] && [ -f .env ]; do sleep 2; done; exec php artisan queue:work --queue=publishing,agents,media,default --sleep=1 --tries=1 --timeout=900'
    depends_on:
      - api

  # Fires due posts every minute and polls media generations (routes/console.php).
  scheduler:
    build: ./docker/php
    volumes:
      - ./backend:/app
      - vendor:/app/vendor
    command: sh -c 'until [ -f vendor/autoload.php ] && [ -f .env ]; do sleep 2; done; exec php artisan schedule:work'
    depends_on:
      - api

  # FlowAI Sound: voices (Kokoro), listening (Whisper) and the composer, on CPU. Models load on
  # first use, take turns (one in memory at a time) and unload when idle: about 140 MB at rest,
  # under 1 GB at its busiest.
  sound:
    build: ./sound
    mem_limit: 1000m
    restart: unless-stopped

  # The voice assistant (assistant/): the Assistant page talks to it at /assistant/ through the
  # Vite proxy. Speech recognition and its voice run on an NVIDIA GPU (NVIDIA container toolkit),
  # so it only starts when asked: docker compose --profile assistant up -d
  # The first start downloads its speech models (about 6 GB) into assistant-models.
  # Settings (the Ollama key, ComfyUI, VoiceStudio) are in assistant/.env, from assistant/.env.example.
  assistant:
    build: ./assistant
    profiles: [assistant]
    env_file: ./assistant/.env
    environment: &assistant-env
      FLOWAI_URL: http://api:8000
      FLOWAI_DASHBOARD_URL: http://localhost:5173
      BROWSER_ENABLED: "false"
    ports:
      - "${ASSISTANT_PORT:-8003}:8000"
    volumes: &assistant-volumes
      - assistant-models:/cache
      - assistant-media:/app/media
      - assistant-voices:/app/voices
      - assistant-data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - api
    restart: unless-stopped

  # The same without a GPU: docker compose --profile assistant-cpu up -d
  # Recognition takes about 2 s after you stop talking; set TTS_URL (VoiceStudio) for its voice.
  assistant-cpu:
    build:
      context: ./assistant
      args:
        TORCH: cpu
    profiles: [assistant-cpu]
    env_file: ./assistant/.env
    environment:
      <<: *assistant-env
      ASR_DEVICE: cpu
      ASR_DTYPE: float32
      TTS_DEVICE: cpu
      TTS_DTYPE: float32
    ports:
      - "${ASSISTANT_PORT:-8003}:8000"
    volumes: *assistant-volumes
    depends_on:
      - api
    restart: unless-stopped

  # Catches every email the API sends. Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # Local text models, free and private, at http://ollama:11434 from the API.
  # Pull a model once: docker compose exec ollama ollama pull llama3.1:8b
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama

volumes:
  vendor:
  ollama:
  assistant-models:
  assistant-media:
  assistant-voices:
  assistant-data:
